name: Build UEFI firmware

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            git \
            python3 \
            python3-distutils \
            gcc-aarch64-linux-gnu \
            g++-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu \
            nasm \
            iasl \
            uuid-dev \
            libssl-dev

      - name: Build firmware
        env:
          BUILD_JOBS: 4
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: TB311FU-UEFI
          path: Build/TB311FU/DEBUG_GCC5/FV/TB311FU.fd
          if-no-files-found: error
